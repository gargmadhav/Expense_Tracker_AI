<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Smart Expense Tracker AI</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Application Styles -->
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-icon"><i class="fa-solid fa-brain"></i></div>
        <span class="brand-text" style="font-size: 1.35rem;">Smart Expense AI</span>
      </div>

      <h2 class="auth-title">Reset password</h2>
      <p class="auth-subtitle">Enter your registered email to receive reset instructions</p>

      <form id="forgotPasswordForm" class="auth-form">
        <div class="form-group">
          <label class="form-label" for="resetEmail">Email Address</label>
          <input type="email" id="resetEmail" class="form-control" placeholder="name@example.com" required>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;">
          Send Recovery Link <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>

      <div class="auth-footer">
        Remember your password? <a href="login.html" style="font-weight: 600;">Back to sign in</a>
      </div>
    </div>
  </div>

  <div class="toast-container"></div>

  <!-- Scripts -->
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
